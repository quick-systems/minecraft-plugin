name: Java CI with Maven and Release

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the code
      - uses: actions/checkout@v4

      # Step 2: Set up JDK 22
      - name: Set up JDK 22
        uses: actions/setup-java@v4
        with:
          java-version: '22'
          distribution: 'temurin'
          cache: maven

      # Step 3: Build with Maven
      - name: Build with Maven
        run: mvn -B package --file pom.xml

      # Step 4: Extract version from pom.xml and remove 'v' if it exists
      - name: Get version from pom.xml
        id: get_version
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          VERSION=${VERSION//v/}  # Usuwanie 'v' z wersji, jeśli występuje
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      # Step 5: Check if release exists
      - name: Check if release exists
        id: release_check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_URL=$(curl -s \
            -H "Authorization: token $GITHUB_TOKEN" \
            https://api.github.com/repos/${{ github.repository }}/releases/tags/v${{ env.VERSION }} \
            | jq -r '.url')
          if [ "$RELEASE_URL" != "null" ]; then
            echo "Release already exists at $RELEASE_URL"
            echo "RELEASE_EXISTS=true" >> $GITHUB_ENV
            # Get the upload URL with {name,label} as required by GitHub
            UPLOAD_URL=$(curl -s -H "Authorization: token $GITHUB_TOKEN" "$RELEASE_URL" | jq -r '.upload_url' | sed -e "s/{?name,label}//")
            echo "UPLOAD_URL=$UPLOAD_URL" >> $GITHUB_ENV
          else
            echo "No existing release found for v${{ env.VERSION }}."
            echo "RELEASE_EXISTS=false" >> $GITHUB_ENV
          fi

      # Step 6: Create a new release only if it doesn't exist
      - name: Create GitHub Release
        id: create_release
        if: env.RELEASE_EXISTS == 'false'
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ env.VERSION }}  # Tag from pom.xml version
          release_name: Release v${{ env.VERSION }}
          draft: false
          prerelease: false

      # Step 7: Upload the built quickshop.jar to the release
      - name: Upload quickshop.jar to release
        if: env.RELEASE_EXISTS == 'false' || env.RELEASE_EXISTS == 'true'  # Upload if release exists or if new release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ env.UPLOAD_URL }}  # Ensure the URL contains {name,label}
          asset_path: target/quickshop-${{ env.VERSION }}.jar  # Use the correct JAR filename
          asset_name: quickshop-${{ env.VERSION }}.jar
          asset_content_type: application/java-archive

