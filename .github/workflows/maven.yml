name: Java CI with Maven and Release

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 22
        uses: actions/setup-java@v4
        with:
          java-version: '22'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B package --file pom.xml

      - name: Get version from plugin.yml
        id: get_version
        run: |
          RAW_VERSION=$(grep '^version:' src/main/resources/plugin.yml | cut -d ' ' -f2)
          VERSION=$(echo "$RAW_VERSION" | tr -d "'\"" | xargs)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "TAG_NAME=v$VERSION" >> $GITHUB_ENV

      - name: Get or create GitHub Release
        id: get_or_create_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_RESPONSE=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
            https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ env.TAG_NAME }})
          
          RELEASE_ID=$(echo "$RELEASE_RESPONSE" | jq -r '.id')
          UPLOAD_URL=$(echo "$RELEASE_RESPONSE" | jq -r '.upload_url' | sed -e "s/{.*//")

          if [ "$RELEASE_ID" == "null" ]; then
            echo "Creating new release ${{ env.TAG_NAME }}"
            CREATE_RESPONSE=$(curl -s -X POST -H "Authorization: token $GITHUB_TOKEN" \
              -d "{\"tag_name\": \"${{ env.TAG_NAME }}\", \"name\": \"Release ${{ env.TAG_NAME }}\", \"draft\": false, \"prerelease\": false}" \
              https://api.github.com/repos/${{ github.repository }}/releases)

            RELEASE_ID=$(echo "$CREATE_RESPONSE" | jq -r '.id')
            UPLOAD_URL=$(echo "$CREATE_RESPONSE" | jq -r '.upload_url' | sed -e "s/{?name,label}//")
          fi

          echo "RELEASE_ID=$RELEASE_ID" >> $GITHUB_ENV
          echo "UPLOAD_URL=$UPLOAD_URL" >> $GITHUB_ENV

      - name: Delete existing JAR from release (if exists)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ASSET_ID=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
            https://api.github.com/repos/${{ github.repository }}/releases/${{ env.RELEASE_ID }}/assets \
            | jq -r '.[] | select(.name == "quickshop-${{ env.VERSION }}.jar") | .id')

          if [ "$ASSET_ID" != "" ] && [ "$ASSET_ID" != "null" ]; then
            echo "Deleting existing asset ID $ASSET_ID"
            curl -s -X DELETE -H "Authorization: token $GITHUB_TOKEN" \
              https://api.github.com/repos/${{ github.repository }}/releases/assets/$ASSET_ID
          else
            echo "No existing asset to delete."
          fi

      - name: Upload quickshop.jar to release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ env.UPLOAD_URL }}
          asset_path: target/quickshop-${{ env.VERSION }}.jar
          asset_name: quickshop-${{ env.VERSION }}.jar
          asset_content_type: application/java-archive
